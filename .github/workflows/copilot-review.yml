name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  quality-checks:
    name: Lint, TypeScript, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  copilot-review:
    name: Senior Copilot PR review
    runs-on: ubuntu-latest
    needs: quality-checks
    if: always()
    steps:
      - name: Request senior engineering review
        uses: github/copilot-pull-request-review@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
